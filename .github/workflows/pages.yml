# Die öffentliche Vorschau auf GitHub Pages: dieselbe App, ohne Einladungssperre geöffnet,
# mit Beispieldaten gefüllt und ohne Zugang zum echten Backend. Was die Markierung ändert,
# steht in js/demo.js. Die App für die Freunde wird nicht angefasst: sie wird getrennt aus
# diesem Repo ausgerollt und behält DEMO = false.
name: Preview

on:
  push:
    branches: [main]
  # Jeden Montag, damit die Beispieldaten weiter gestern enden und nicht in die Vergangenheit
  # wandern: tools/build_showcase.mjs zählt vom Tag aus zurück, an dem es läuft.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Assemble the preview
        run: |
          mkdir _site
          # Eine Liste und keine Kopie von allem: Tests, Werkzeuge, Server-SQL und der Zustand
          # der Supabase-CLI haben auf einer öffentlichen Seite nichts verloren.
          cp -R index.html legal.html privacy.html manifest.webmanifest css js icons assets _site/
          node tools/build_showcase.mjs > _site/showcase-backup.json
          printf 'export const DEMO = true;\n' > _site/js/demo.js
          # Der eigene Worker der Vorschau statt des echten, der die Beispieldaten der letzten
          # Woche cachen würde. Er räumt weg, was die App hier im Juli hinterlassen hat, und
          # liefert danach nichts aus. Wie, steht in tools/preview-sw.js.
          cp tools/preview-sw.js _site/sw.js
          # Das echte Projekt aus der CSP nehmen, damit nichts es erreichen kann.
          sed -i 's# https://txjikhreoshmkjuyomki\.supabase\.co##' _site/index.html
          if grep -q 'supabase' _site/index.html; then
            echo 'The preview CSP still allows Supabase'; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

# Beide Testsammlungen bei jedem Push und Pull Request. Die README verspricht das, seit es
# die Tests gibt, und diese Datei sorgt dafür, dass es stimmt.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Maths, crypto, language and security
        run: npm test

      - name: Chromium for the browser suite
        run: npx playwright install --with-deps chromium
      - name: Workout flows in a phone-sized browser
        run: npm run test:browser

      # playwright.config.js hebt von jedem fehlgeschlagenen Fall einen Trace auf. Ohne diesen
      # Schritt würde er mit dem Runner verschwinden.
      - name: Keep the traces of a failed browser run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

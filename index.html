<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No maximum-scale/user-scalable: iOS Safari ignores both anyway, and every
       browser that honours them only ends up denying pinch zoom to someone who
       needs it. Inputs are 16px, which is what actually stops the zoom-on-focus
       jump those attributes are usually reached for. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiftLog</title>
  <meta name="description" content="Personal workout tracker">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1 id="screen-title">Train</h1>
      <div id="topbar-actions"></div>
    </header>

    <main id="screen" tabindex="-1"></main>

    <nav id="tabbar" role="tablist">
      <button class="tab" data-route="home" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-route="train" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"/></svg>
        <span>Train</span>
      </button>
      <button class="tab" data-route="plans" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span>Plans</span>
      </button>
      <button class="tab" data-route="library" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h5v16H5zM14 4h5v16h-5"/></svg>
        <span>Library</span>
      </button>
      <button class="tab" data-route="calendar" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span>Calendar</span>
      </button>
    </nav>
  </div>

  <div id="rest-bar" hidden>
    <button id="rest-dismiss" aria-label="Stop rest timer">&times;</button>
    <div id="rest-info">
      <strong id="rest-remaining">1:30</strong>
      <span id="rest-label">Rest</span>
    </div>
    <button id="rest-add" aria-label="Add 30 seconds">+30s</button>
    <div id="rest-progress"><i></i></div>
  </div>

  <div id="sheet-host" hidden>
    <div id="sheet-scrim"></div>
    <section id="sheet" role="dialog" aria-modal="true">
      <header><h2 id="sheet-title"></h2><button id="sheet-close" aria-label="Close">&times;</button></header>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

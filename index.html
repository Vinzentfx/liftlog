<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No maximum-scale/user-scalable: iOS Safari ignores both anyway, and every
       browser that honours them only ends up denying pinch zoom to someone who
       needs it. Inputs are 16px, which is what actually stops the zoom-on-focus
       jump those attributes are usually reached for. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiftLog</title>
  <meta name="description" content="Personal workout tracker">
  <!-- media-src carries the rest timer's two generated WAVs (js/rest.js): a
       silent loop that keeps a backgrounded iOS app running, and the chime.
       Both are built in code as data: URIs so there is still no audio asset. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data:; connect-src 'self' https://txjikhreoshmkjuyomki.supabase.co https://world.openfoodfacts.org; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'self'">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1 id="screen-title">Train</h1>
      <div id="topbar-actions"></div>
    </header>

    <main id="screen" tabindex="-1"></main>

    <nav id="tabbar" role="tablist">
      <button class="tab" data-route="home" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
        <span data-i18n="tab.home">Home</span>
      </button>
      <button class="tab" data-route="train" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"/></svg>
        <span data-i18n="tab.train">Train</span>
      </button>
      <button class="tab" data-route="nutrition" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v7a3 3 0 0 0 6 0V3M9 10v11"/><path d="M18 3c-1.7 1.6-2.5 3.6-2.5 6 0 1.7.6 3 1.8 3.7V21"/></svg>
        <span data-i18n="tab.food">Food</span>
      </button>
      <button class="tab" data-route="plans" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span data-i18n="tab.plans">Plans</span>
      </button>
      <button class="tab" data-route="users" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-4 2.4-6 5.5-6s5 2 5.5 6M15 6.5a3 3 0 0 1 0 5.5M16 13c2.7.4 4.2 2.4 4.5 6"/></svg>
        <span data-i18n="tab.users">Users</span>
      </button>
    </nav>
  </div>

  <div id="rest-bar" hidden>
    <button id="rest-dismiss" data-i18n-aria="rest.stop" aria-label="Stop rest timer">&times;</button>
    <div id="rest-info">
      <strong id="rest-remaining">1:30</strong>
      <span id="rest-label" data-i18n="rest.label">Rest</span>
    </div>
    <button id="rest-add" data-i18n-aria="rest.add30" aria-label="Add 30 seconds">+30s</button>
    <div id="rest-progress"><i></i></div>
  </div>

  <div id="sheet-host" hidden>
    <div id="sheet-scrim"></div>
    <section id="sheet" role="dialog" aria-modal="true">
      <header><h2 id="sheet-title"></h2><button id="sheet-close" data-i18n-aria="common.close" aria-label="Close">&times;</button></header>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Registers repairs before the module graph loads. If an older offline
       cache contains a mixed deployment, this can still install the complete
       replacement even when app.js itself cannot start. -->
  <script src="js/bootstrap.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
